name: Release
on:
  push:
    tags:
      - 'v*'

jobs:
  build-universal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Install platform deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-0 libgdk-pixbuf2.0-0 libx11-6

      - name: Restore & Build
        run: |
          dotnet restore
          dotnet build -c Release

      - name: Publish linux
        run: |
          dotnet publish src/Bonsai.UI -c Release -f net10.0 -r linux-x64 --self-contained true \
            -p:PublishSingleFile=true -p:PublishTrimmed=true -p:PublishReadyToRun=true -o ./publish/linux-x64

      - name: Package linux (AppImage)
        run: |
          chmod +x scripts/pack-appimage.sh && scripts/pack-appimage.sh ./publish/linux-x64 ./artifacts

      - name: Upload linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: bonsai-linux
          path: artifacts/**

      - name: Publish mac
        run: |
          dotnet publish src/Bonsai.UI -c Release -f net10.0 -r osx-x64 --self-contained true \
            -p:PublishSingleFile=true -p:PublishTrimmed=true -p:PublishReadyToRun=true -o ./publish/osx-x64

      - name: Package mac (.dmg)
        run: |
          chmod +x scripts/make-dmg.sh && scripts/make-dmg.sh ./publish/osx-x64 ./artifacts

      - name: Upload mac artifact
        uses: actions/upload-artifact@v4
        with:
          name: bonsai-mac
          path: artifacts/**

  build-msi:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Install WiX
        run: choco install wixtoolset --no-progress

      - name: Restore & Build
        run: |
          dotnet restore
          dotnet build -c Release

      - name: Publish Win
        run: |
          dotnet publish src/Bonsai.UI -c Release -f net10.0 -r win-x64 --self-contained true \
            -p:PublishSingleFile=true -p:PublishTrimmed=true -p:PublishReadyToRun=true -o ./publish/win-x64

      - name: Build MSI
        run: pwsh -c "./scripts/build-msi.ps1 -BinariesDir ./publish/win-x64 -OutputDir ./artifacts"

      - name: Upload msi artifact
        uses: actions/upload-artifact@v4
        with:
          name: bonsai-msi
          path: artifacts/*.msi

  create-release:
    runs-on: ubuntu-latest
    needs: [build-universal, build-msi]
    steps:
      - uses: actions/checkout@v4

      - name: Download linux artifact
        uses: actions/download-artifact@v4
        with:
          name: bonsai-linux
          path: release-artifacts/linux

      - name: Download mac artifact
        uses: actions/download-artifact@v4
        with:
          name: bonsai-mac
          path: release-artifacts/mac

      - name: Download MSI
        uses: actions/download-artifact@v4
        with:
          name: bonsai-msi
          path: release-artifacts/windows

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload release assets
        uses: softprops/action-gh-release@v1
        with:
          files: |
            release-artifacts/linux/**
            release-artifacts/mac/**
            release-artifacts/windows/**
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
