name: Release
on:
  push:
    tags:
      - 'v*'

jobs:
  build-release:
    if: github.ref_type == 'tag'
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
            asset_name: bonsai-linux
          - os: macos-latest
            rid: osx-arm64
            asset_name: bonsai-mac
          - os: macos-latest
            rid: osx-x64
            asset_name: bonsai-mac-intel
          - os: windows-latest
            rid: win-x64
            asset_name: bonsai-windows
    steps:
      - uses: actions/checkout@v4

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      - name: Install Linux Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-0 libgdk-pixbuf2.0-0 libx11-6 fuse
          wget https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage -O /usr/local/bin/appimagetool
          chmod +x /usr/local/bin/appimagetool

      - name: Install Chocolatey
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Set-ExecutionPolicy Bypass -Scope Process -Force; [System.Net.ServicePointManager]::SecurityProtocol = [System.Net.ServicePointManager]::SecurityProtocol -bor 3072; iex ((New-Object System.Net.WebClient).DownloadString('https://community.chocolatey.org/install.ps1'))

      - name: Install WiX Toolset v3
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install wixtoolset --yes --force
          echo "C:\Program Files (x86)\WiX Toolset v3.11\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Restore & Build
        run: |
          dotnet restore
          dotnet build -c Release

      - name: Publish
        if: runner.os != 'Windows'
        run: dotnet publish src/Bonsai.UI -c Release -f net8.0 -r ${{ matrix.rid }} --self-contained true -p:PublishSingleFile=true -p:PublishTrimmed=false -p:PublishReadyToRun=true -p:DebugType=None -o ./publish/${{ matrix.rid }}
        shell: bash

      - name: Publish (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: dotnet publish src/Bonsai.UI -c Release -f net8.0 -r ${{ matrix.rid }} --self-contained true -p:PublishSingleFile=true -p:PublishTrimmed=false -p:PublishReadyToRun=true -p:DebugType=None -o ./publish/${{ matrix.rid }}

      - name: Package (Linux AppImage)
        if: runner.os == 'Linux'
        env:
          CI: true
        run: |
          ./scripts/pack-appimage.sh ./publish/${{ matrix.rid }} ./artifacts

      - name: Package (macOS DMG)
        if: runner.os == 'macOS'
        env:
          CI: true
        run: |
          chmod +x scripts/make-dmg.sh && scripts/make-dmg.sh ./publish/${{ matrix.rid }} ./artifacts

      - name: Package (Windows MSI)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/build-msi.ps1 -BinariesDir ./publish/${{ matrix.rid }} -OutputDir ./artifacts

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: artifacts/**

  create-release:
    needs: build-release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4

      - name: Download Linux Artifacts
        uses: actions/download-artifact@v4
        with:
          name: bonsai-linux
          path: release-artifacts/linux

      - name: Download macOS Artifacts
        uses: actions/download-artifact@v4
        with:
          name: bonsai-mac
          path: release-artifacts/mac

      - name: Download macOS Intel Artifacts
        uses: actions/download-artifact@v4
        with:
          name: bonsai-mac-intel
          path: release-artifacts/mac

      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: bonsai-windows
          path: release-artifacts/windows

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            release-artifacts/linux/**
            release-artifacts/mac/**
            release-artifacts/windows/**
          token: ${{ secrets.GH_PUSH }}
