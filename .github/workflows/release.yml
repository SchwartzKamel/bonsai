name: Release
on:
  push:
    tags:
      - 'v*'
  workflow_run:
    workflows:
      - 'CI Test'
    types:
      - completed

jobs:
  build-release:
    if: >-
      (github.event_name == 'push') || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
            asset_name: bonsai-linux
          - os: macos-latest
            rid: osx-x64
            asset_name: bonsai-mac
          - os: windows-latest
            rid: win-x64
            asset_name: bonsai-windows
    steps:
      - uses: actions/checkout@v4

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Install Linux Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-0 libgdk-pixbuf2.0-0 libx11-6
          # Install appimage-builder dependencies
          sudo apt-get install -y fuse
          wget https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          mv appimagetool-x86_64.AppImage /usr/local/bin/appimagetool

      - name: Install WiX (Windows)
        if: runner.os == 'Windows'
        run: choco install wixtoolset --no-progress

      - name: Restore & Build
        run: |
          dotnet restore
          dotnet build -c Release

      - name: Publish
        run: |
          dotnet publish src/Bonsai.UI -c Release -f net10.0 -r ${{ matrix.rid }} --self-contained true \
            -p:PublishSingleFile=true -p:PublishTrimmed=true -p:PublishReadyToRun=true -o ./publish/${{ matrix.rid }}

      - name: Package (Linux AppImage)
        if: runner.os == 'Linux'
        run: |
          appimage-builder --recipe appimage-builder.yml
          mv Bonsai-x86_64.AppImage ./artifacts/Bonsai-linux-x64.AppImage

      - name: Package (macOS DMG)
        if: runner.os == 'macOS'
        run: |
          chmod +x scripts/make-dmg.sh && scripts/make-dmg.sh ./publish/${{ matrix.rid }} ./artifacts

      - name: Package (Windows MSI)
        if: runner.os == 'Windows'
        run: |
          ./scripts/build-msi.ps1 -BinariesDir ./publish/${{ matrix.rid }} -OutputDir ./artifacts

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: artifacts/**

  create-release:
    needs: build-release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4

      - name: Download Linux Artifacts
        uses: actions/download-artifact@v4
        with:
          name: bonsai-linux
          path: release-artifacts/linux

      - name: Download macOS Artifacts
        uses: actions/download-artifact@v4
        with:
          name: bonsai-mac
          path: release-artifacts/mac

      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: bonsai-windows
          path: release-artifacts/windows

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            release-artifacts/linux/**
            release-artifacts/mac/**
            release-artifacts/windows/**
          token: ${{ secrets.GH_PUSH }}
