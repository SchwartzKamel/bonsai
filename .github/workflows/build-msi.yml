name: Build MSI
on:
  workflow_dispatch:
  push:
    paths:
      - 'installer/**'
      - 'src/**'

jobs:
  build-msi:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'
      - name: Install WiX Toolset v4
        shell: pwsh
        run: |
          $wixUrl = "https://github.com/wixtoolset/wix/releases/download/v4.0.4/wix40-x86-en.msi"
          $wixMsiPath = "wix40-x86-en.msi"
          Invoke-WebRequest -Uri $wixUrl -OutFile $wixMsiPath
          Start-Process msiexec.exe -ArgumentList "/i $wixMsiPath /quiet /norestart" -Wait -NoNewWindow
          $wixBinPath = "C:\Program Files (x86)\WiX Toolset v4\bin"
          echo "$wixBinPath" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Restore & Build
        run: |
          dotnet restore
          dotnet build -c Release

      - name: Publish Win self-contained
        run: dotnet publish src/Bonsai.UI -c Release -f net8.0 -r win-x64 --self-contained true -p:PublishSingleFile=true -p:PublishTrimmed=false -p:PublishReadyToRun=true -p:DebugType=None -o ./publish/win-x64
        shell: pwsh

      - name: Build MSI (WiX)
        run: pwsh -c "./scripts/build-msi.ps1 -BinariesDir ./publish/win-x64 -OutputDir ./artifacts"

      - name: Upload MSI
        uses: actions/upload-artifact@v4
        with:
          name: bonsai-windows-msi
          path: artifacts/*.msi
